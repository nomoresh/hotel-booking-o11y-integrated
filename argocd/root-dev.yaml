
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nomoresh/hotel-booking-o11y-integrated.git
    targetRevision: dev,joon
    path: argocd/apps/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true