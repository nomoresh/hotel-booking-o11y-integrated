apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hotel-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nomoresh/hotel-booking-o11y-integrated.git
    targetRevision: main
    path: charts/hotel
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true