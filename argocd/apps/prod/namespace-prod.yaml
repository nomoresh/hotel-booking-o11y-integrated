apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nomoresh/hotel-booking-o11y-integrated.git
    targetRevision: main
    path: argocd/platform/namespaces/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true