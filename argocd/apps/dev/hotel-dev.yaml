apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hotel-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nomoresh/hotel-booking-o11y-integrated.git
    targetRevision: joon
    path: charts/hotel
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true