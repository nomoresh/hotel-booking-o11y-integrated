# 로컬 Prometheus(observability/prometheus/rules/alerts.yml)와 동일한 알림 규칙을
# 클러스터의 Prometheus Operator가 평가하도록 PrometheusRule CRD로 변환.
# release 라벨이 있어야 kube-prometheus-stack-values.yaml의 기본 ruleSelector에 걸림
# (ServiceMonitor와 동일한 규칙).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hotel-booking-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: hotel-booking-alerts
      rules:
        # 에러율 1% 초과 시 알림
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) by (job)
              /
              sum(rate(http_server_requests_seconds_count[1m])) by (job)
            ) > 0.01
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} 에러율 초과"
            description: "{{ $labels.job }}의 에러율이 {{ $value | humanizePercentage }} 입니다. (임계치: 1%)"

        # p95 응답시간 200ms 초과 시 알림
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket[5m])) by (job, le)
            ) > 0.2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} 응답시간 지연"
            description: "{{ $labels.job }}의 p95 응답시간이 {{ $value | humanizeDuration }} 입니다. (임계치: 200ms)"

        # 서비스 다운 감지
        - alert: ServiceDown
          expr: up{job=~"hotel-svc-.*"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} 서비스 다운"
            description: "{{ $labels.job }} 서비스가 응답하지 않습니다."
