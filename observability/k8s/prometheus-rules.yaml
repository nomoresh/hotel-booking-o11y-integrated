# 로컬 Prometheus(observability/prometheus/rules/alerts.yml)와 동일한 알림 규칙을
# 클러스터의 Prometheus Operator가 평가하도록 PrometheusRule CRD로 변환.
# release 라벨이 있어야 kube-prometheus-stack-values.yaml의 기본 ruleSelector에 걸림
# (ServiceMonitor와 동일한 규칙).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hotel-booking-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: hotel-booking-alerts
      rules:
        # 에러율 1% 초과 시 알림
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) by (job)
              /
              sum(rate(http_server_requests_seconds_count[1m])) by (job)
            ) > 0.01
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} 에러율 초과"
            description: "{{ $labels.job }}의 에러율이 {{ $value | humanizePercentage }} 입니다. (임계치: 1%)"

        # p95 응답시간 200ms 초과 시 알림
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_server_requests_seconds_bucket[5m])) by (job, le)
            ) > 0.2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.job }} 응답시간 지연"
            description: "{{ $labels.job }}의 p95 응답시간이 {{ $value | humanizeDuration }} 입니다. (임계치: 200ms)"

        # 서비스 다운 감지
        # min by(job)로 집계하는 이유: 집계 없이 up==0만 쓰면 파드가 재시작되며
        # pod/instance 라벨이 바뀔 때마다 별개의 알림 인스턴스로 취급되어 "for" 타이머가
        # 매번 리셋됨(실제로 장애 주입 리허설 중 발견) — job 단위로 집계해야 파드 교체와
        # 무관하게 지속 시간이 누적됨.
        # absent(...) 절이 추가로 필요한 이유: 레플리카가 0이 되면(예: 장애 주입으로 스케일
        # 다운) 스크래핑 대상 자체가 사라져서 up 시계열이 "0"이 아니라 "없음"이 되어 위 조건에
        # 안 걸림 — 대상이 아예 없어진 경우도 다운으로 간주하도록 별도로 묶음.
        - alert: ServiceDown
          expr: |
            (min by (job) (up{job=~"hotel-svc-.*"}) == 0)
            or absent(up{job="hotel-svc-user"})
            or absent(up{job="hotel-svc-search"})
            or absent(up{job="hotel-svc-event"})
            or absent(up{job="hotel-svc-notice"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} 서비스 다운"
            description: "{{ $labels.job }} 서비스가 응답하지 않습니다."
