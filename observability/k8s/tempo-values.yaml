# Tempo 단독 배포. 로컬과 동일하게 OTLP(gRPC/HTTP)로 트레이스를 직접 수신.
# EBS CSI 드라이버 설치 완료 후 emptyDir 대신 실제 PVC로 전환 (파드 재시작해도 트레이스 유지됨)
persistence:
  enabled: true
  size: 5Gi
  storageClassName: gp2

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 512Mi

tempo:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# 데모 규모라 리텐션 짧게
retention: 24h
