global:
  resolve_timeout: 5m
  # 실제 값은 커밋하지 않음 — .github/workflows/deploy-alertmanager.yml이 배포 시
  # GitHub Secret(SLACK_WEBHOOK_URL)으로 이 파일을 다시 생성해서 덮어씀
  slack_api_url: '__REPLACED_BY_CI_FROM_GITHUB_SECRET__'

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'slack-alerts'
  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
    - match:
        severity: warning
      receiver: 'slack-warning'

receivers:
  - name: 'slack-alerts'
    slack_configs:
      - channel: '#hotel-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *서비스:* {{ .Labels.job }}
          *설명:* {{ .Annotations.description }}
          {{ end }}

  - name: 'slack-critical'
    slack_configs:
      - channel: '#hotel-alerts'
        send_resolved: true
        icon_emoji: ':red_circle:'
        title: '🚨 [CRITICAL] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *서비스:* {{ .Labels.job }}
          *설명:* {{ .Annotations.description }}
          {{ end }}

  - name: 'slack-warning'
    slack_configs:
      - channel: '#hotel-alerts'
        send_resolved: true
        icon_emoji: ':warning:'
        title: '⚠️ [WARNING] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *서비스:* {{ .Labels.job }}
          *설명:* {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'job']
