services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoteldb
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel1234
    ports:
      - "5433:5432" # 호스트 5432는 다른 프로젝트(sprint-log-db)가 사용 중이라 5433으로 매핑
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hoteldb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: hotel-prometheus
    restart: unless-stopped
    # 백엔드 3개는 컨테이너가 아니라 호스트에서 ./gradlew bootRun으로 직접 떠 있으므로
    # host.docker.internal로 호스트에 접근함 (Linux에서는 extra_hosts가 필요, Mac/Windows Docker Desktop은 기본 지원)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.3
    container_name: hotel-loki
    restart: unless-stopped
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100" # 백엔드 서비스가 호스트에서 직접 이 포트로 로그를 push함
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:3.0.2
    container_name: hotel-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo 자체 쿼리 API
      - "4317:4317"   # OTLP gRPC 수신
      - "4318:4318"   # OTLP HTTP 수신 (백엔드 서비스가 호스트에서 직접 이 포트로 trace를 push함)

  grafana:
    image: grafana/grafana:12.3.8
    container_name: hotel-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000" # 프론트엔드가 이미 3000을 쓰고 있어 3001로 매핑

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  tempo_data:
