services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoteldb
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel1234
    ports:
      - "5433:5432" # 호스트 5432는 다른 프로젝트(sprint-log-db)가 사용 중이라 5433으로 매핑
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hoteldb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: hotel-prometheus
    restart: unless-stopped
    # 백엔드 3개는 컨테이너가 아니라 호스트에서 ./gradlew bootRun으로 직접 떠 있으므로
    # host.docker.internal로 호스트에 접근함 (Linux에서는 extra_hosts가 필요, Mac/Windows Docker Desktop은 기본 지원)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.8
    container_name: hotel-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000" # 프론트엔드가 이미 3000을 쓰고 있어 3001로 매핑

volumes:
  postgres_data:
  grafana_data:
