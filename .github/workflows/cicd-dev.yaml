name: DEV ECR CI/CD

on:
  push:
    branches:
      - joon
    paths:
      - "apps/user-service/**"
      - "apps/search-service/**"
      - "apps/event-service/**"
      - "apps/hotel-frontend/**"
      - "charts/hotel/values-dev.yaml"
      - ".github/workflows/cicd-dev.yaml"

  pull_request:
    branches:
      - joon
    paths:
      - "apps/user-service/**"
      - "apps/search-service/**"
      - "apps/event-service/**"
      - "apps/hotel-frontend/**"
      - "charts/hotel/values-dev.yaml"
      - ".github/workflows/cicd-dev.yaml"

  workflow_dispatch:
    inputs:
      build_all:
        description: "Build all backend services"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: cicd-dev
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "074467724762"
  ECR_REGISTRY: 074467724762.dkr.ecr.ap-northeast-2.amazonaws.com
  VALUES_FILE: charts/hotel/values-dev.yaml

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      user: ${{ steps.filter.outputs.user }}
      search: ${{ steps.filter.outputs.search }}
      event: ${{ steps.filter.outputs.event }}
      frontend: ${{ steps.filter.outputs.frontend }}
      build_all: ${{ steps.build_all.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user:
              - 'apps/user-service/**'
            search:
              - 'apps/search-service/**'
            event:
              - 'apps/event-service/**'
            frontend:
              - 'apps/hotel-frontend/**'

      - name: Resolve build_all option
        id: build_all
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_all }}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  test-build-scan-push:
    name: Test, build, scan and push
    needs: detect-changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hoteldb
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel1234
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hotel -d hoteldb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - service_key: user
            service_name: user-service
            context: apps/user-service
            ecr_repo: hotel-svc-user
            values_key: user
            changed_output: user
            service_type: backend

          - service_key: search
            service_name: search-service
            context: apps/search-service
            ecr_repo: hotel-svc-search
            values_key: search
            changed_output: search
            service_type: backend

          - service_key: event
            service_name: event-service
            context: apps/event-service
            ecr_repo: hotel-svc-event
            values_key: event
            changed_output: event
            service_type: backend

          - service_key: frontend
            service_name: hotel-frontend
            context: apps/hotel-frontend
            ecr_repo: hotel-frontend
            values_key: frontend
            changed_output: frontend
            service_type: frontend

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4

      - name: Decide whether to build this service
        id: should_build
        shell: bash
        run: |
          SHOULD_BUILD="false"

          if [ "${{ needs.detect-changes.outputs.build_all }}" = "true" ]; then
            SHOULD_BUILD="true"
          fi

          if [ "${{ matrix.service_key }}" = "user" ] && \
             [ "${{ needs.detect-changes.outputs.user }}" = "true" ]; then
            SHOULD_BUILD="true"
          fi

          if [ "${{ matrix.service_key }}" = "search" ] && \
             [ "${{ needs.detect-changes.outputs.search }}" = "true" ]; then
            SHOULD_BUILD="true"
          fi

          if [ "${{ matrix.service_key }}" = "event" ] && \
             [ "${{ needs.detect-changes.outputs.event }}" = "true" ]; then
            SHOULD_BUILD="true"
          fi

          if [ "${{ matrix.service_key }}" = "frontend" ] && \
             [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            SHOULD_BUILD="true"
          fi

          echo "value=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "SHOULD_BUILD=$SHOULD_BUILD" >> "$GITHUB_ENV"

      - name: Set short image tag
        if: env.SHOULD_BUILD == 'true'
        shell: bash
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Skip unchanged service
        if: env.SHOULD_BUILD != 'true'
        run: |
          echo "${{ matrix.service_name }} was not changed. Skipping."

      - name: Set up JDK 21
        if: env.SHOULD_BUILD == 'true' && matrix.service_type == 'backend'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend unit tests
        if: env.SHOULD_BUILD == 'true' && matrix.service_type == 'backend'
        working-directory: ${{ matrix.context }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

      - name: Set up Node.js
        if: env.SHOULD_BUILD == 'true' && matrix.service_type == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.context }}/package-lock.json

      - name: Build frontend
        if: env.SHOULD_BUILD == 'true' && matrix.service_type == 'frontend'
        working-directory: ${{ matrix.context }}
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Configure AWS credentials
        if: env.SHOULD_BUILD == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.SHOULD_BUILD == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: env.SHOULD_BUILD == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scan
        if: env.SHOULD_BUILD == 'true'
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # 추후 sarif 추가해서 보안 강화 

      - name: Push Docker image to ECR
        if: env.SHOULD_BUILD == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ matrix.ecr_repo }}:${{ env.IMAGE_TAG }}"

  update-values:
    name: Update Helm values
    needs:
      - detect-changes
      - test-build-scan-push
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: joon
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Install yq
        shell: bash
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update values-dev.yaml image tags
        shell: bash
        run: |
          yq -i '.global.imageRegistry = "${{ env.ECR_REGISTRY }}"' "$VALUES_FILE"

          if [ "${{ needs.detect-changes.outputs.build_all }}" = "true" ] || [ "${{ needs.detect-changes.outputs.user }}" = "true" ]; then
            yq -i '.services.user.imageName = "hotel-svc-user"' "$VALUES_FILE"
            yq -i '.services.user.imageTag = "${{ env.IMAGE_TAG }}"' "$VALUES_FILE"
          fi

          if [ "${{ needs.detect-changes.outputs.build_all }}" = "true" ] || [ "${{ needs.detect-changes.outputs.search }}" = "true" ]; then
            yq -i '.services.search.imageName = "hotel-svc-search"' "$VALUES_FILE"
            yq -i '.services.search.imageTag = "${{ env.IMAGE_TAG }}"' "$VALUES_FILE"
          fi

          if [ "${{ needs.detect-changes.outputs.build_all }}" = "true" ] || [ "${{ needs.detect-changes.outputs.event }}" = "true" ]; then
            yq -i '.services.event.imageName = "hotel-svc-event"' "$VALUES_FILE"
            yq -i '.services.event.imageTag = "${{ env.IMAGE_TAG }}"' "$VALUES_FILE"
          fi

          if [ "${{ needs.detect-changes.outputs.build_all }}" = "true" ] || [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
            yq -i '.services.frontend.imageName = "hotel-frontend"' "$VALUES_FILE"
            yq -i '.services.frontend.imageTag = "${{ env.IMAGE_TAG }}"' "$VALUES_FILE"
          fi

      - name: Commit and push updated values-dev.yaml
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No values-dev.yaml changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$VALUES_FILE"
          git commit -m "ci: update ECR image tags ${IMAGE_TAG} [skip ci]"
          git push origin joon

  notify-slack:
    name: Notify Slack
    needs:
      - detect-changes
      - test-build-scan-push
      - update-values
    runs-on: ubuntu-latest

    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Notify success
        if: needs.test-build-scan-push.result == 'success' && needs.update-values.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ DEV CI/CD 성공
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Registry: ${{ env.ECR_REGISTRY }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify failure
        if: needs.test-build-scan-push.result == 'failure' || needs.update-values.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ DEV CI/CD 실패
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Actor: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}