name: Deploy Alertmanager Config

on:
  push:
    branches:
      - feat/alertmanager
      - main
    paths:
      - 'observability/alertmanager/**'
      - 'observability/prometheus/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate alertmanager.yml from secret
        run: |
          cat > observability/alertmanager/alertmanager.yml << ALERTMANAGER
          global:
            resolve_timeout: 5m
            slack_api_url: '${{ secrets.SLACK_WEBHOOK_URL }}'

          route:
            group_by: ['alertname', 'job']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 1h
            receiver: 'slack-alerts'
            routes:
              - match:
                  severity: critical
                receiver: 'slack-critical'
              - match:
                  severity: warning
                receiver: 'slack-warning'

          receivers:
            - name: 'slack-alerts'
              slack_configs:
                - channel: '#hotel-alerts'
                  send_resolved: true
                  title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
                  text: >-
                    {{ range .Alerts }}
                    *서비스:* {{ .Labels.job }}
                    *설명:* {{ .Annotations.description }}
                    {{ end }}

            - name: 'slack-critical'
              slack_configs:
                - channel: '#hotel-alerts'
                  send_resolved: true
                  icon_emoji: ':red_circle:'
                  title: '🚨 [CRITICAL] {{ .CommonLabels.alertname }}'
                  text: >-
                    {{ range .Alerts }}
                    *서비스:* {{ .Labels.job }}
                    *설명:* {{ .Annotations.description }}
                    {{ end }}

            - name: 'slack-warning'
              slack_configs:
                - channel: '#hotel-alerts'
                  send_resolved: true
                  icon_emoji: ':warning:'
                  title: '⚠️ [WARNING] {{ .CommonLabels.alertname }}'
                  text: >-
                    {{ range .Alerts }}
                    *서비스:* {{ .Labels.job }}
                    *설명:* {{ .Annotations.description }}
                    {{ end }}

          inhibit_rules:
            - source_match:
                severity: 'critical'
              target_match:
                severity: 'warning'
              equal: ['alertname', 'job']
          ALERTMANAGER

      - name: Show generated config (URL masked)
        run: |
          cat observability/alertmanager/alertmanager.yml | sed 's|hooks.slack.com/services/.*|hooks.slack.com/services/***MASKED***|'
