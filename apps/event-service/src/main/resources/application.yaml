server:
  port: 8084 # 특가 예약

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5433/hoteldb
    username: hotel
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  # HS256 알고리즘 특성상 비밀키는 반드시 32바이트(256비트) 이상의 문자열이어야 에러가 안 납니다
  secret: secret-key-for-hotel-booking-service-o11y-integration-2026-must-be-long-enough
  expiration: 43200000 # 토큰 만료 시간 (12시간)

search-service:
  # 결제 금액 검증을 위해 호텔 basePrice를 조회하는 대상
  # base-url: http://localhost:8085
  base-url: ${SEARCH_SERVICE_BASE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0 # 로컬 데모용 — 모든 요청을 샘플링 (운영에서는 낮춰야 함)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces