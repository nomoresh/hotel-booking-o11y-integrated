plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hotel'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// Lettuce(Redis 클라이언트)가 물고 오는 netty-codec 4.1.135.Final에 HIGH 취약점(CVE-2026-59901,
// Bzip2Decoder 무한루프 DoS)이 있어 Trivy 스캔이 막음. netty 모듈들은 한 릴리스로 묶여서 배포되므로
// 개별 모듈만 올리면 버전이 어긋날 수 있어, io.netty 전체를 수정 버전으로 강제 통일한다.
configurations.all {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'io.netty' && details.requested.name.startsWith('netty-')) {
			details.useVersion '4.1.136.Final'
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	implementation 'com.github.loki4j:loki-logback-appender:2.0.3'
	runtimeOnly 'org.postgresql:postgresql:42.7.12'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

    // user-service가 발급한 JWT 쿠키를 검증하기 위한 의존성 (io.jsonwebtoken)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}

tasks.named('test') {
	useJUnitPlatform()
}
