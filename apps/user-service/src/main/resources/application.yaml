server:
  port: 8083 # 다른 마이크로서비스와 겹치지 않게 8083 할당

# 로컬 개발(3000)과 클러스터 프론트 주소를 기본값으로 같이 허용.
# 배포 환경이 바뀌면 CORS_ALLOWED_ORIGINS 환경변수로 덮어쓰면 됨 (콤마로 여러 개 구분).
cors:
  allowed-origins: http://localhost:3000,http://k8s-dev-hoteling-349b0ab528-48488193.ap-northeast-2.elb.amazonaws.com

# Secure 쿠키는 HTTPS에서만 브라우저가 저장/전송함. localhost는 브라우저가 예외로 봐줘서 기본값(true)
# 그대로 로컬 개발엔 문제없지만, ALB가 아직 HTTP만 지원하는 클러스터 환경에서는 COOKIE_SECURE=false로 꺼야 함.
cookie:
  secure: ${COOKIE_SECURE:true}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/hoteldb
    username: hotel
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  # HS256 알고리즘 특성상 비밀키는 반드시 32바이트(256비트) 이상의 문자열이어야 에러가 안 납니다
  secret: secret-key-for-hotel-booking-service-o11y-integration-2026-must-be-long-enough
  expiration: 43200000 # 토큰 만료 시간 (12시간)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0 # 로컬 데모용 — 모든 요청을 샘플링 (운영에서는 낮춰야 함)
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}