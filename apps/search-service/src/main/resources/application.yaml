server:
  port: 8085 # 호텔 조회

spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5433/hoteldb
    username: hotel
    password: hotel1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0 # 로컬 데모용 — 모든 요청을 샘플링 (운영에서는 낮춰야 함)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
