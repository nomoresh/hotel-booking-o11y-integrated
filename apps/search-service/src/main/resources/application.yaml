server:
  port: 8085 # 호텔 조회

spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5433/hoteldb
    username: hotel
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
