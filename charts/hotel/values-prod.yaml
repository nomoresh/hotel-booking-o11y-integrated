global:
  namespace: prod
  imageRegistry: 074467724762.dkr.ecr.ap-northeast-2.amazonaws.com
  imagePullPolicy: Always
database:
  host: hotel-postgres
  port: 5432
  name: hoteldb
  username: hotel
  secretName: hotel-db-secret
redis:
  host: hotel-redis
  port: 6379
serviceDefaults:
  appType: backend
  replicas: 2
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  probes:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
services:
  user:
    enabled: true
    name: hotel-svc-user
    imageName: hotel-svc-user
    imageTag: "19d413d"
    port: 8083
    env:
      # ALB가 HTTP만 지원해서 Secure 쿠키를 켜두면 로그인 자체가 안 됨 (브라우저가 저장/전송을 거부)
      COOKIE_SECURE: "false"
  search:
    enabled: true
    name: hotel-svc-search
    imageName: hotel-svc-search
    imageTag: "19d413d"
    port: 8085
  event:
    enabled: true
    name: hotel-svc-event
    imageName: hotel-svc-event
    imageTag: "3de9ce5"
    port: 8084
    env:
      SEARCH_SERVICE_BASE_URL: "http://hotel-svc-search:8085"
  notice:
    enabled: true
    name: hotel-svc-notice
    imageName: hotel-svc-notice
    imageTag: "3de9ce5"
    port: 8086
  frontend:
    enabled: true
    appType: frontend
    name: hotel-frontend
    imageName: hotel-frontend
    imageTag: "46397c2"
    port: 3000
    probes:
      enabled: true
      path: /
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200,302,404"
  rules:
    - path: /api/v1/users
      pathType: Prefix
      serviceName: hotel-svc-user
      servicePort: 8083
    - path: /api/v1/hotels
      pathType: Prefix
      serviceName: hotel-svc-search
      servicePort: 8085
    - path: /api/v1/events
      pathType: Prefix
      serviceName: hotel-svc-event
      servicePort: 8084
    - path: /api/v1/bookings
      pathType: Prefix
      serviceName: hotel-svc-event
      servicePort: 8084
    - path: /api/v1/queue
      pathType: Prefix
      serviceName: hotel-svc-event
      servicePort: 8084
    - path: /
      pathType: Prefix
      serviceName: hotel-frontend
      servicePort: 3000
