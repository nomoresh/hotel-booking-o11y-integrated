apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app: hotel-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-redis
  template:
    metadata:
      labels:
        app: hotel-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    app: hotel-redis
spec:
  type: ClusterIP
  selector:
    app: hotel-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379