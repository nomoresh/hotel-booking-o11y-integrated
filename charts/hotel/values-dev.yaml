global:
  namespace: dev
  imageRegistry: 074467724762.dkr.ecr.ap-northeast-2.amazonaws.com
  imagePullPolicy: Always
database:
  host: hotel-postgres
  port: 5432
  name: hoteldb
  username: hotel
  secretName: hotel-db-secret
redis:
  host: hotel-redis
  port: 6379
serviceDefaults:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    enabled: true
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
services:
  user:
    enabled: true
    name: hotel-svc-user
    imageName: hotel-svc-user
    imageTag: "ab27e76"
    port: 8083
  search:
    enabled: true
    name: hotel-svc-search
    imageName: hotel-svc-search
    imageTag: "ab27e76"
    port: 8085
  event:
    enabled: true
    name: hotel-svc-event
    imageName: hotel-svc-event
    imageTag: "ab27e76"
    port: 8084
  frontend:
    enabled: true
    name: hotel-frontend
    imageName: hotel-frontend
    imageTag: "524fdea"
    port: 3000
    probes:
      enabled: true
      path: /
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200,302,404"
  rules:
    - path: /
      pathType: Prefix
      serviceName: hotel-frontend
      servicePort: 3000
    - path: /users
      pathType: Prefix
      serviceName: hotel-svc-user
      servicePort: 8083
    - path: /search
      pathType: Prefix
      serviceName: hotel-svc-search
      servicePort: 8085
    - path: /events
      pathType: Prefix
      serviceName: hotel-svc-event
      servicePort: 8084
